# Render's free plan sleeps the backend after 15 minutes without traffic. This pings it every
# 10 minutes between 09:30 and 18:30 IST only: the worker keeps the Neon database busy while the
# backend is awake, and running all day would use about 186 of Neon's 100 free compute-hours a month.
name: Keep demo awake

on:
  schedule:
    - cron: '*/10 4-12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://localstock-api.onrender.com/health/live
