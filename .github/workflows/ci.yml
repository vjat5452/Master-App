name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit and HTTP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  db-test:
    name: Database tests (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: localstock
          POSTGRES_USER: localstock
          POSTGRES_PASSWORD: localstock_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U localstock -d localstock"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RUN_DB_TESTS: '1'
      # Tests create and use localstock_test; they never touch this database.
      DATABASE_URL: postgres://localstock:localstock_ci_password@localhost:5432/localstock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Migrations apply, roll back (all but 001) and re-apply
        run: |
          npm run db:migrate
          npm run db:migrate:down -- 5
          npm run db:migrate
      - run: npm run test:db

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fails on high or critical advisories in production dependencies.
      - run: npm audit --omit=dev --audit-level=high

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build API, worker and web images
        run: |
          docker build -f apps/api/Dockerfile -t localstock-api .
          docker build -f apps/worker/Dockerfile -t localstock-worker .
          docker build -f apps/web/Dockerfile -t localstock-web .
