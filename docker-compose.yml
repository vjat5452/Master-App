services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: localstock-postgres
    environment:
      POSTGRES_DB: localstock
      POSTGRES_USER: localstock
      POSTGRES_PASSWORD: localstock_dev_password
    ports:
      - "5432:5432"
    volumes:
      - localstock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localstock -d localstock"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: localstock-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: localstock-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: localstock
      RABBITMQ_DEFAULT_PASS: localstock_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  localstock_pgdata:
